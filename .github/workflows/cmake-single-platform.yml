name: Build and Test LV2 Plugin

# Define the events that trigger this workflow
on:
  push:
    branches:
      - master  # Trigger on pushes to the main branch
    tags:
      - 'v*'    # Trigger on version tag pushes (e.g., v1.2.3)
  pull_request:
    branches:
      - master  # Trigger on pull requests to the main branch
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        ubuntu-version: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.ubuntu-version }}

    steps:
    # Step 1: Checkout the repository code
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: 'recursive'
        fetch-depth: 0  # fetch full history so submodules can be checked out reliably

    # Step 2: Install dependencies
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential pkg-config lv2-dev libzita-resampler-dev fakeroot

    # Step 3: Configure the project using CMake
    - name: Configure CMake
      run: cmake -B build -S .  # Configure the project, specifying the build directory

    # Step 4: Build the project
    - name: Build
      run: cmake --build build -- -j$(nproc)  # Build the project using all available processors

    # Step 5: Package DEB
    - name: Build Debian package
      run: cmake --build build --target package

    # Step 6: List generated packages
    - name: List generated Debian packages
      run: find build -name '*.deb' -print

